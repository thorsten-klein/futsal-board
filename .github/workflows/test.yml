name: Tests

on:
  push:
    branches: [develop]
  pull_request:

# Cancel any in-progress run for the same branch/PR when a new commit is pushed.
# Different branches and PRs still run independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: Tests (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and system deps
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: ./test.sh --shard=${{ matrix.shard }}/4

      - name: Diagnose coverage output
        if: always()
        run: |
          echo "=== ls -la (repo root) ==="
          ls -la
          echo
          echo "=== ls -la .nyc_output/ ==="
          ls -la .nyc_output/ 2>&1 || echo "(.nyc_output directory is missing)"
          echo
          echo "=== JSON file count in .nyc_output/ ==="
          find .nyc_output -name '*.json' 2>/dev/null | wc -l

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .nyc_output/
          if-no-files-found: error    # fail the job — coverage data MUST be produced
          retention-days: 1

  coverage:
    name: Merge coverage and upload to Codecov
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() }}    # also run if some shards failed — coverage from passing tests is still useful
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: .nyc_output
          merge-multiple: true    # flatten all artifacts into one .nyc_output directory

      - name: Show merged coverage summary
        run: npx nyc report --reporter=text-summary

      - name: Generate lcov report
        run: npx nyc report --reporter=lcov --report-dir=coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}    # required for private repos; ignored for public
